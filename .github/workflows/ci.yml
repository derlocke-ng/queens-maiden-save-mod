name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Lua syntax
        run: |
          for f in mods/*/Scripts/main.lua; do
            echo "luac -p $f"
            luac5.4 -p "$f"
          done

      - name: Shell and Python syntax
        run: |
          for f in tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile tools/*.py

      - name: Build mod-only package
        run: python3 tools/build_release.py --version 0.0.0-ci --mod-only

      - uses: actions/upload-artifact@v4
        with:
          name: QDQuickSave-ci
          path: dist/
