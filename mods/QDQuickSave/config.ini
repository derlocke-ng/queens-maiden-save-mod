; QDQuickSave hotkeys
;
; Change the key after the "=", save this file and restart the game.
;
; Keys:       F1 ... F12, A ... Z, 0 ... 9, Num0 ... Num9, Insert, Delete, Home, End, PageUp, PageDown,
;             Up, Down, Left, Right, Tab, Space, Backspace, Enter, Pause
; Modifiers:  Ctrl, Shift, Alt - put them in front with a "+", e.g. Ctrl+S or Shift+F9
;
; Use two different keys, and keys the game does not already use.
; A wrong name falls back to F5 / F9; the game shows a message and ue4ss/UE4SS.log says why.
; Updating the mod replaces this file: keep a copy if you changed it.

QuickSave = F5
QuickLoad = F9
